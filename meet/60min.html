<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Book a 60-minute meeting with Jan Bauer. Times are shown in your time zone.">
  <meta property="og:title" content="Book a 60-minute meeting with Jan Bauer">
  <meta property="og:description" content="Pick a time that works for you. Times are shown in your time zone.">
  <title>60 min · Book a meeting · Jan Bauer</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="page">
    <p id="preview-note" class="preview-note" hidden>Preview with sample times. Nothing is booked.</p>
    <section id="booking-shell" class="card" aria-label="Book a meeting">
      <aside id="info" class="info"></aside>
      <div id="booking-content" class="content"></div>
    </section>
    <footer class="footer"><button id="admin-open" class="text-button" type="button">Admin</button></footer>
    <dialog id="admin-dialog" class="admin-dialog" aria-labelledby="admin-title">
      <div id="admin-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
</body>
</html>
