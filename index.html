<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jan Bauer</title>
  <style>
    :root { color-scheme: light dark; --bg: #faf8f4; --fg: #1d1d1b; --muted: #6b6a64; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161614; --fg: #f1efe9; --muted: #9c9a92; } }
    :root[data-theme="dark"] { --bg: #161614; --fg: #f1efe9; --muted: #9c9a92; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { padding: 16px; text-align: center; }
    a { color: inherit; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Jan Bauer</h1>
    <p><a href="meet/">Book a meeting</a> · <a href="https://japhba.github.io/">japhba.github.io</a></p>
  </main>
</body>
</html>
